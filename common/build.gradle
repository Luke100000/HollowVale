plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // GeckoLib injects GeoRenderState into render states at runtime, this lets common compile against it
    interfaceInjectionData {
        from('interface_injections.json')
    }
}

dependencies {
    compileOnly group: 'net.fabricmc', name: 'sponge-mixin', version: '0.17.3+mixin.0.8.7'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.3'
    compileOnly "maven.modrinth:geckolib:${geckolib_neoforge_version}"
    compileOnly "maven.modrinth:biolith:${biolith_neoforge_version}"
    compileOnly "maven.modrinth:terrablender:${terrablender_neoforge_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
