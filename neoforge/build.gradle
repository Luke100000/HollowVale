plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    implementation "maven.modrinth:geckolib:${geckolib_neoforge_version}"

    implementation "maven.modrinth:biolith:${biolith_neoforge_version}"
    compileOnly "maven.modrinth:terrablender:${terrablender_neoforge_version}"
}

neoForge {
    version = neoforge_version
    // GeckoLib injects GeoRenderState into render states at runtime, this lets the shared sources compile against it
    interfaceInjectionData {
        from(project(':common').file('interface_injections.json'))
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            jvmArgument('-Xmx3G')
        }
        data {
            clientData()
            jvmArgument('-Xmx3G')
        }
        server {
            server()
            jvmArgument('-Xmx3G')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
