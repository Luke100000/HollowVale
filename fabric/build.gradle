plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

    modCompileOnly "maven.modrinth:biolith:${biolith_fabric_version}"
    modImplementation "maven.modrinth:terrablender:${terrablender_fabric_version}"

    localRuntime "com.electronwill.night-config:core:3.6.7"
    localRuntime "com.electronwill.night-config:toml:3.6.7"

    modLocalRuntime "maven.modrinth:sodium:${sodium_version}"
    modLocalRuntime "maven.modrinth:iris:${iris_version}"

    // Iris nests these
    localRuntime "io.github.douira:glsl-transformer:2.0.1"
    localRuntime "org.anarres:jcpp:1.4.14"
    localRuntime "org.antlr:antlr4-runtime:4.13.1"

    modLocalRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            vmArg("-Xmx3G")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
