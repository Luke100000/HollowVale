plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "maven.modrinth:geckolib:${geckolib_fabric_version}"

    compileOnly "maven.modrinth:biolith:${biolith_fabric_version}"
    implementation "maven.modrinth:terrablender:${terrablender_fabric_version}"

    localRuntime "com.electronwill.night-config:core:3.6.7"
    localRuntime "com.electronwill.night-config:toml:3.6.7"

    localRuntime "maven.modrinth:sodium:${sodium_version}"
    localRuntime "maven.modrinth:iris:${iris_version}"

    // Iris nests these
    localRuntime "io.github.douira:glsl-transformer:2.0.1"
    localRuntime "org.anarres:jcpp:1.4.14"
    localRuntime "org.antlr:antlr4-runtime:4.13.1"

    localRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            vmArg("-Xmx3G")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
            vmArg("-Xmx3G")
        }
    }
}
